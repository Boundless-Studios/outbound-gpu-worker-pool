name: One-off full-history secrets audit

on:
  push:
    branches: [security/secrets-audit-2026-09-07]
    paths: [.github/workflows/secrets-audit.yml]

# Public repository: clone anonymously; no repository token or secrets are used.
permissions: {}

jobs:
  secrets-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ogwp-audit-tools"
          cd "$RUNNER_TEMP/ogwp-audit-tools"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Fetch complete public history including retained PR heads
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git clone --quiet --mirror https://github.com/Boundless-Studios/outbound-gpu-worker-pool.git "$RUNNER_TEMP/ogwp-audit.git"
          git -C "$RUNNER_TEMP/ogwp-audit.git" fetch --quiet origin \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/pull/*/head'
          test "$(git -C "$RUNNER_TEMP/ogwp-audit.git" rev-parse --is-shallow-repository)" = false
          git -C "$RUNNER_TEMP/ogwp-audit.git" fsck --full --no-dangling

      - name: Scan every reachable revision and raw blob; print metadata only
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ['RUNNER_TEMP'])
          mirror = root / 'ogwp-audit.git'
          tool = root / 'ogwp-audit-tools' / 'gitleaks'
          audit = root / 'ogwp-audit-results'
          audit.mkdir(mode=0o700)
          corpus = audit / 'corpus'
          corpus.mkdir(mode=0o700)

          def git(*args, input=None):
              return subprocess.check_output(
                  ['git', '-C', str(mirror), *args], input=input
              )

          refs = dict(line.split(' ', 1) for line in git(
              'for-each-ref', '--format=%(refname) %(objectname)'
          ).decode().splitlines())
          remote = {}
          for line in git('ls-remote', '--refs', 'origin').decode().splitlines():
              sha, ref = line.split('\t', 1)
              if ref.startswith(('refs/heads/', 'refs/tags/')) or (
                  ref.startswith('refs/pull/') and ref.endswith('/head')
              ):
                  remote[ref] = sha
          if any(refs.get(ref) != sha for ref, sha in remote.items()):
              raise RuntimeError('Advertised refs changed or were not fully fetched; audit is incomplete')

          objects = {}
          for line in git('rev-list', '--objects', '--all').decode().splitlines():
              sha, _, path = line.partition(' ')
              objects[sha] = path
          batch = ('\n'.join(objects) + '\n').encode()
          descriptions = git(
              'cat-file', '--batch-check=%(objectname) %(objecttype) %(objectsize)',
              input=batch,
          ).decode().splitlines()
          counts = {'commit': 0, 'blob': 0, 'tree': 0, 'tag': 0}
          binary_blobs = 0
          scanned_bytes = 0
          for description in descriptions:
              sha, kind, size_text = description.split()
              counts[kind] = counts.get(kind, 0) + 1
              if kind not in ('blob', 'commit'):
                  continue
              content = git('cat-file', kind, sha)
              if len(content) != int(size_text):
                  raise RuntimeError('Incomplete object read')
              scanned_bytes += len(content)
              if kind == 'blob' and b'\x00' in content:
                  binary_blobs += 1
              target = corpus / kind
              target.mkdir(exist_ok=True, mode=0o700)
              (target / (sha + '.txt')).write_bytes(content)

          inventory = {
              'main_sha': refs.get('refs/heads/main'),
              'main_reachable_commits': int(git('rev-list', '--count', 'refs/heads/main')),
              'branch_heads_including_audit': sum(r.startswith('refs/heads/') for r in refs),
              'audit_branch': 'security/secrets-audit-2026-09-07',
              'tag_refs': sum(r.startswith('refs/tags/') for r in refs),
              'retained_pr_heads': sum(r.startswith('refs/pull/') and r.endswith('/head') for r in refs),
              'object_counts': counts,
              'binary_blobs': binary_blobs,
              'raw_corpus_bytes': scanned_bytes,
              'advertised_refs_verified': True,
              'shallow_clone': False,
              'refs': refs,
          }
          (audit / 'inventory.json').write_text(json.dumps(inventory, indent=2))
          print('AUDIT_INVENTORY ' + json.dumps(inventory, sort_keys=True), flush=True)

          scans = [
              ('history', ['git', str(mirror), '--log-opts=--all --full-history -m']),
              ('all-raw-blobs-and-commit-metadata', ['dir', str(corpus)]),
          ]
          results = []
          for name, command in scans:
              report = audit / (name + '.json')
              args = [str(tool), *command, '--no-banner', '--redact=100',
                      '--ignore-gitleaks-allow', '--max-decode-depth=2',
                      '--max-archive-depth=2', '--report-format=json',
                      '--report-path=' + str(report)]
              result = subprocess.run(args, cwd=root, capture_output=True, text=True)
              # Never publish scanner output or matched credential values.
              if result.returncode not in (0, 1) or not report.is_file():
                  raise RuntimeError('Scanner did not complete: ' + name + ' exit=' + str(result.returncode))
              findings = json.loads(report.read_text())
              if not isinstance(findings, list):
                  raise RuntimeError('Unexpected scanner report format')
              safe = []
              for finding in findings:
                  item = {key: finding.get(key) for key in (
                      'RuleID', 'File', 'StartLine', 'EndLine', 'Commit', 'Fingerprint'
                  )}
                  object_sha = Path(str(finding.get('File', ''))).stem
                  if object_sha in objects:
                      item['object_sha'] = object_sha
                      item['representative_repository_path'] = objects[object_sha]
                  safe.append(item)
              summary = {'scan': name, 'exit_code': result.returncode,
                         'finding_count': len(safe), 'findings': safe}
              results.append(summary)
              print('AUDIT_RESULT ' + json.dumps(summary, sort_keys=True), flush=True)
          public_report = {'inventory': inventory, 'scans': results}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Full-history secrets audit\n\n')
              summary.write('Gitleaks 8.30.1; release SHA-256 verified; no repository code executed.\n\n')
              summary.write('```json\n' + json.dumps(public_report, indent=2) + '\n```\n')
              summary.write('\nScope: all advertised branches, tags, retained PR heads, reachable blobs, and commit metadata. ') 
              summary.write('Excludes unreachable server objects, external LFS payloads, Actions logs/artifacts, and native secret-scanning alerts.\n')
          print('AUDIT_COMPLETE', flush=True)
          sys.exit(1 if any(r['finding_count'] for r in results) else 0)
          PY
