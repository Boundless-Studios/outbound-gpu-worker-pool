name: Security source snapshot (temporary)
on:
  push:
    branches: [security/fix-enrollment-and-admission]
    paths: [.github/workflows/security-source-snapshot.yml]
permissions: {}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download test dependency wheels without executing repository code
        run: |
          set -euo pipefail
          python3 -m pip download --only-binary=:all: --python-version 3.13 --dest "$RUNNER_TEMP/wheelhouse" 'asyncpg>=0.30' 'google-cloud-storage>=3' 'google-auth>=2.38' requests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-test-wheels
          path: ${{ runner.temp }}/wheelhouse/
          retention-days: 1
          if-no-files-found: error
