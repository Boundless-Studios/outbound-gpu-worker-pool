name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: worker_pool
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d worker_pool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
        env:
          OUTBOUND_GPU_WORKER_POOL_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/worker_pool
