# WSL GPU access for the engine only; never mount the Windows filesystem or the
# Docker socket, and never give the agent a GPU (verify.py refuses it).
services:
  engine:
    devices: [/dev/dxg:/dev/dxg:rw]
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      TRITON_LIBCUDA_PATH: /usr/lib/wsl/lib
    volumes:
      - type: bind
        source: /usr/lib/wsl/lib
        target: /usr/lib/wsl/lib
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /usr/lib/wsl/drivers
        target: /usr/lib/wsl/drivers
        read_only: true
        bind: {create_host_path: false}
